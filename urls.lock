  "_comment": [
    "Addresses this site has published. scripts/check-urls.mjs fails the build when one",
    "of them stops being built and no declared successor is built either. GitHub Pages",
    "serves no per-path 301, so a path that stops being built 404s silently and takes",
    "every inbound link with it.",
    "SEEDED 2026-08-01 from the LIVE sitemap at https://tomscholtes.com/sitemap.xml, not",
    "from a local build, so it records what the public was actually served. /lab/* and",
    "anything carrying a noindex robots meta are absent because post-build.mjs excludes",
    "them from the sitemap, so this gate cannot enshrine a preview or an unindexed page.",
    "ADDING a path never fails this gate; publishing an essay passes untouched. Refresh",
    "deliberately with: node scripts/check-urls.mjs --update",
    "extra: addresses the sitemap cannot carry, because it is built by walking for",
    "index.html and a bare .html file is invisible to it. Checked as files on disk.",
    "successors: old -> new, for a removal that was deliberate. This host cannot",
    "redirect, so it records intent and keeps the trail; it does not make the old",
    "address serve.",
    "The four /rss.xml addresses are in extra for the same reason as the .html files: post-build.mjs builds the sitemap by walking for index.html, so a feed endpoint is invisible to it. A feed that silently stops building would strand every subscriber."
  ],
